[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "coders-agent-lab"
version = "0.1.0"
description = "A local, test-led workshop on MCP tools and agent harnesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # adapters 0.3.2 requires MCP <2; see docs/COMPATIBILITY.md.
  "mcp==1.30.0",
  "psycopg[binary,pool]==3.3.5",
  "psycopg-pool==3.3.1",
  "pydantic==2.13.5",
  "python-dotenv==1.2.3",
  "httpx==0.28.1",
  "langchain==1.4.0",
  "langchain-core==1.6.2",
  "langchain-mcp-adapters==0.3.2",
  "langchain-anthropic==1.7.2",
  "typing-extensions==4.16.0",
  "sqlglot==30.18.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-timeout==2.4.0", "ruff==0.16.7"]

[project.scripts]
agentlab-server = "agentlab.mcp_server.server:main"
agentlab-raw = "agentlab.harness.raw_loop:main"
agentlab-lc = "agentlab.harness.lc_agent:main"
agentlab-trace = "agentlab.harness.trace:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
addopts = "--tb=short -ra"
markers = ["smoke: supplied infrastructure that must pass before exercises", "live: explicit opt-in call to the Anthropic API"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
