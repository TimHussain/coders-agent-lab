<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>The Enchanted Fortune Teller</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090611;color:#f8eaff;font-family:Georgia,serif}
body{min-height:100svh;background:radial-gradient(ellipse at 50% 32%,#3d1763 0%,#1c1033 36%,#090611 79%);overflow-x:hidden}
.stage{position:relative;isolation:isolate;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 38px;overflow:hidden}
.stage:before{content:'';position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(100deg,transparent 0 92px,#a26cb009 93px 95px,transparent 96px 170px),radial-gradient(ellipse at 50% 110%,#76278d3b,transparent 65%)}
.window{position:absolute;right:3%;top:5%;width:17vw;max-width:220px;min-width:100px;height:34vh;border:10px solid #25172b;border-radius:50% 50% 8px 8px;box-shadow:0 0 0 3px #5a3157,inset 0 0 40px #070411;background:radial-gradient(circle at 70% 27%,#b994e0 0 12%,transparent 13%),linear-gradient(#1b123a,#371e58 55%,#080710);opacity:.65}
.window:after{content:'';position:absolute;top:0;bottom:0;left:48%;border-left:6px solid #26152e}
.candle{position:absolute;bottom:11%;height:80px;width:20px;background:linear-gradient(90deg,#4c235a,#b35db7,#53266a);border-radius:7px 7px 3px 3px;box-shadow:0 0 30px #ce61d25e}
.candle:before{content:'';position:absolute;width:12px;height:24px;left:4px;top:-26px;background:radial-gradient(ellipse,#fff7c3 5%,#ffa852 36%,transparent 72%);filter:drop-shadow(0 0 12px #ffaf57)}
.candle.left{left:8%}.candle.right{right:9%;height:120px}
h1{font-size:clamp(1rem,2vw,1.5rem);font-weight:400;letter-spacing:.23em;text-transform:uppercase;color:#e9c6f6;text-align:center;margin:0 0 12px;text-shadow:0 0 14px #ab59db}
.ball-wrap{width:min(77vw,68vh,610px);aspect-ratio:1;position:relative;filter:drop-shadow(0 0 24px #b24cf280)}
.ball{position:absolute;inset:3%;border-radius:50%;overflow:hidden;border:3px solid #c68af9;background:radial-gradient(circle at 36% 29%,#e2b4ff99 0%,transparent 17%),radial-gradient(ellipse at 60% 75%,#c466f9a8 0%,transparent 45%),radial-gradient(circle at 50% 45%,#501079 5%,#24043c 55%,#0b041c 90%);box-shadow:inset -20px -22px 50px #05000dc7,inset 12px 10px 35px #a756e5c9,0 0 15px #c05fff,0 0 80px #a736ec65}
.ball:after{content:'';position:absolute;inset:4%;border-radius:50%;border-top:9px solid #eac4ff88;transform:rotate(-23deg);filter:blur(5px)}
.mist{position:absolute;inset:12%;border-radius:46%;background:conic-gradient(from 40deg,transparent,#c95bfa66,transparent,#9b32e5a8,transparent,#edb6ff6b,transparent);filter:blur(22px);animation:swirl 11s linear infinite;mix-blend-mode:screen}
.mist.second{inset:22%;animation-duration:8s;animation-direction:reverse;filter:blur(17px);opacity:.9}
.star{position:absolute;color:#f3d4ff;text-shadow:0 0 14px white;font-size:clamp(13px,2vw,24px);animation:twinkle 2.6s ease-in-out infinite alternate}
.s1{top:21%;left:30%}.s2{top:43%;right:24%;animation-delay:.7s}.s3{bottom:26%;left:41%;animation-delay:1.3s}
.stand{height:35px;width:65%;margin:-7px auto 10px;background:linear-gradient(#ab6d9f,#3a153e 48%,#120a21);border:3px solid #a57a86;border-radius:50%;box-shadow:0 12px 20px #000}
.controls{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:-5px;z-index:2}
.mic{width:92px;height:92px;border-radius:50%;border:3px solid #d29aff;background:radial-gradient(circle at 40% 30%,#8c4bb7,#341050 80%);color:#fff;box-shadow:0 0 0 7px #5c2c8260,0 0 28px #ad65f6;cursor:pointer;display:grid;place-items:center;touch-action:manipulation}
.mic svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mic:focus-visible{outline:4px solid white;outline-offset:9px}.mic:disabled{opacity:.6;cursor:not-allowed}
.mic.listening{animation:pulse 1s ease-in-out infinite alternate}
.status{font:600 clamp(16px,2vw,21px)/1.4 system-ui,sans-serif;text-align:center;min-height:52px;max-width:540px;color:#f3defb;text-shadow:0 2px 8px #14071c}
.small{font:13px/1.5 system-ui,sans-serif;text-align:center;color:#c7b5d3;max-width:520px}
body.magic .ball{animation:success .7s ease-in-out 3;box-shadow:0 0 45px #f1b4ff,0 0 120px #c15fff,inset 0 0 65px #efc7ff}
body.magic .mist{animation-duration:1.1s}
@keyframes swirl{to{transform:rotate(360deg)}}@keyframes twinkle{to{opacity:.25;transform:scale(.7)}}@keyframes pulse{to{box-shadow:0 0 0 17px #8c4abb66,0 0 55px #e0a0ff}}@keyframes success{50%{filter:brightness(2)}}
@media(max-height:680px){.ball-wrap{width:min(60vw,53vh,430px)}.mic{width:70px;height:70px}.mic svg{width:34px;height:34px}.stage{padding:12px 14px}}
@media(prefers-reduced-motion:reduce){.mist,.star,.mic.listening,.magic .ball{animation:none!important}}

/* Atmospheric crystal ball; microphone floats over its lower edge. */
body{background:radial-gradient(ellipse at 50% 44%,#402067,#1a1029 43%,#08060d 85%)}
.stage{background:radial-gradient(ellipse at 50% 78%,#a13fb22b,transparent 50%);padding:28px 15px}
.stage:after{content:'';position:absolute;bottom:0;left:0;right:0;height:15%;background:linear-gradient(#1c1021,#08050c);border-top:4px solid #49304b;z-index:-1}
.ball-wrap{width:min(80vw,76vh,720px);filter:drop-shadow(0 0 38px #a751e6)}
.ball{box-shadow:inset -28px -28px 58px #04010c,inset 15px 13px 48px #c48de6a6,0 0 30px #bd67f3,0 0 90px #aa39e76b}
.stand{width:55%;height:42px;margin:-20px auto 0;z-index:1;position:relative}
.controls{position:absolute;left:50%;top:calc(50% + min(25vw,23vh,220px));transform:translateX(-50%);margin:0;z-index:5}
.mic{width:90px;height:90px;background:radial-gradient(circle at 32% 20%,#bc81e0,#54246f 70%,#271034);border:3px solid #e2b5ff}
.mic.listening{animation:pulse .8s ease-in-out infinite alternate}
.status{font:600 14px/1.35 system-ui,sans-serif;min-height:0;color:#ffe3ee}
.status:empty{display:none}
.status:not(:empty){position:absolute;top:108%;width:min(80vw,340px);background:#21122ddb;padding:9px;border:1px solid #ac72d5;border-radius:12px}
.window{height:40vh;opacity:.55}
.candle.left{height:125px;left:11%}.candle.right{height:155px;right:12%}
body.magic .mist{animation-duration:.6s}
@media(max-height:670px){.ball-wrap{width:min(62vw,65vh,510px)}.controls{top:calc(50% + min(20vw,20vh,150px))}.mic{width:65px;height:65px}.mic svg{width:32px;height:32px}}

.scene>.window,.scene>.candle,.scene>h1,.scene>.ball-wrap,.scene>.stand{display:none!important}
.scene .controls{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);margin:0;z-index:8;gap:0}
.scene .mic{width:clamp(44px,7.2vw,104px);height:clamp(44px,7.2vw,104px);border-radius:50%;background:radial-gradient(circle at 40% 24%,#ad66e3,#3e105f 80%);border:3px solid #e7b1ff;box-shadow:0 0 0 5px #6e24a58c,0 0 22px #c756ff;cursor:pointer;display:grid;place-items:center;touch-action:manipulation}
.scene .mic svg{width:55%;height:55%;stroke:#fff}
.scene .mic.listening{animation:pulse .8s ease-in-out infinite alternate}
.scene .status{position:absolute;top:110%;left:50%;transform:translateX(-50%);width:min(75vw,330px);font:600 14px/1.4 system-ui,sans-serif;color:#ffe6f8;text-align:center}
.scene .status:empty{display:none}
.scene .status:not(:empty){background:#140a24e8;border:1px solid #bd8ada;border-radius:12px;padding:9px 12px}
.scene::after{content:'';position:absolute;left:30%;top:14%;width:40%;aspect-ratio:1;border-radius:50%;pointer-events:none;background:conic-gradient(from 30deg,transparent 0 15%,#b95aff30 30%,transparent 50%,#b95aff24 73%,transparent 90%);filter:blur(24px);mix-blend-mode:screen;animation:swirl 14s linear infinite}
body.magic .scene::after{animation-duration:.65s;background:conic-gradient(from 30deg,#d96aff22,#f1baffb0,#a74bfa33,#ffdbff88,#c06bff33);filter:blur(12px)}
body.magic .scene{filter:drop-shadow(0 0 30px #c15df7)}
@media(max-width:600px){.scene .mic{width:clamp(42px,8vw,62px);height:clamp(42px,8vw,62px)}}
@media(prefers-reduced-motion:reduce){.scene::after,.scene .mic.listening{animation:none!important}}

/* Align the live button with the microphone pictured in the background. */
.scene .controls{left:50%;top:79.2%;transform:translate(-50%,-50%);z-index:10}
.scene .mic{width:clamp(48px,7.5vw,108px);height:clamp(48px,7.5vw,108px)}
/* Animated mist is a real layer over the painted crystal ball, not a static image. */
.scene .ball-magic-overlay{
 position:absolute;left:30.4%;top:13.1%;width:39.2%;aspect-ratio:1;border-radius:50%;
 overflow:hidden;pointer-events:none;z-index:4;mix-blend-mode:screen;
 opacity:.42;transition:opacity .4s ease;
 -webkit-mask-image:radial-gradient(circle,#000 0 75%,transparent 97%);
 mask-image:radial-gradient(circle,#000 0 75%,transparent 97%);
}
.scene .magic-cloud{position:absolute;inset:8%;border-radius:50%;transform-origin:50% 50%;filter:blur(12px)}
.scene .cloud-one{background:conic-gradient(from 0deg,transparent 5%,#c45cff50 21%,transparent 40%,#edb9ff8a 58%,transparent 77%,#8d2fffa8);animation:orbTurn 14s linear infinite}
.scene .cloud-two{inset:17%;background:conic-gradient(from 60deg,#d178ff99,transparent 27%,#f3baff70,transparent 61%,#bc52ef90);animation:orbTurn 9s linear infinite reverse;filter:blur(19px)}
.scene .cloud-three{inset:27%;background:conic-gradient(from 10deg,transparent,#f0b4ff9c,transparent,#bd53fa8a,transparent);animation:orbTurn 6s linear infinite;filter:blur(17px)}
.scene .magic-sparkles{position:absolute;inset:12%;background:radial-gradient(circle at 23% 29%,#fff 0 1%,transparent 2%),radial-gradient(circle at 72% 48%,#fff 0 1%,transparent 2%),radial-gradient(circle at 49% 74%,#f2c2ff 0 1.5%,transparent 3%);animation:orbTurn 19s linear infinite}
@keyframes orbTurn{to{transform:rotate(360deg)}}
body.magic .scene .ball-magic-overlay{opacity:1;filter:brightness(1.8) saturate(1.5);animation:orbPulse .65s ease-in-out 4}
body.magic .scene .cloud-one{animation-duration:.8s;filter:blur(7px)}
body.magic .scene .cloud-two{animation-duration:1.1s;filter:blur(9px)}
body.magic .scene .cloud-three{animation-duration:.65s;filter:blur(7px)}
@keyframes orbPulse{50%{filter:brightness(2.5) saturate(1.7)}}
@media(max-width:650px){.scene .mic{width:clamp(43px,8vw,66px);height:clamp(43px,8vw,66px)}}
@media(prefers-reduced-motion:reduce){.scene .magic-cloud,.scene .magic-sparkles,.magic .scene .ball-magic-overlay{animation:none!important}}

/* Enchanted words materialise inside the ball after the mist clears. */
.scene .fortune-writing{
 position:absolute;z-index:7;left:50%;top:41%;transform:translate(-50%,-50%) scale(.92);
 width:34%;min-height:16%;padding:1.6% 2.1%;display:flex;flex-direction:column;
 justify-content:center;align-items:center;gap:.4vw;pointer-events:none;
 text-align:center;opacity:0;visibility:hidden;
 border-radius:40%;background:radial-gradient(ellipse,#170a36e6 0%,#2c0d51ad 55%,transparent 83%);
 filter:blur(10px);transition:opacity 1.4s ease,filter 1.4s ease,transform 1.4s ease,visibility 0s linear 1.4s;
}
.scene .fortune-writing.revealed{
 opacity:1;visibility:visible;filter:blur(0);transform:translate(-50%,-50%) scale(1);
 transition:opacity 1.4s ease,filter 1.4s ease,transform 1.4s ease,visibility 0s;
}
.scene .fortune-name{
 color:#fff4e9;font:italic 700 clamp(17px,3.8vw,66px)/1.08 Georgia,'Times New Roman',serif;
 letter-spacing:.015em;text-shadow:0 0 9px #ffffff,0 0 25px #d17aff,0 3px 9px #1b0534;
 overflow-wrap:break-word;
}
.scene .fortune-time{
 color:#f5d9ff;font:500 clamp(12px,1.65vw,30px)/1.3 Georgia,serif;
 letter-spacing:.12em;text-shadow:0 0 11px #d998ff,0 2px 7px #180729;
}
@media(max-width:650px){.scene .fortune-name{font-size:clamp(14px,3.7vw,24px)}.scene .fortune-time{font-size:clamp(10px,1.8vw,15px)}}
@media(prefers-reduced-motion:reduce){.scene .fortune-writing{transition:none!important}}

/* Calm, breathing mist before the spell; faster rotation only during magic. */
.scene .cloud-one{animation:idleFloatA 8.5s ease-in-out infinite alternate!important}
.scene .cloud-two{animation:idleFloatB 11s ease-in-out infinite alternate!important}
.scene .cloud-three{animation:idleFloatC 7.5s ease-in-out infinite alternate!important}
.scene .magic-sparkles{animation:idleFloatB 15s ease-in-out infinite alternate!important}
@keyframes idleFloatA{from{transform:translate(-3%,-2%) scale(.96)}to{transform:translate(3%,2%) scale(1.04)}}
@keyframes idleFloatB{from{transform:translate(2%,-3%) scale(1.03)}to{transform:translate(-3%,3%) scale(.96)}}
@keyframes idleFloatC{from{transform:translate(-2%,3%) scale(.95)}to{transform:translate(3%,-2%) scale(1.06)}}
body.magic .scene .cloud-one{animation:orbTurn .95s linear infinite!important}
body.magic .scene .cloud-two{animation:orbTurn 1.35s linear infinite reverse!important}
body.magic .scene .cloud-three{animation:orbTurn .8s linear infinite!important}
body.magic .scene .magic-sparkles{animation:orbTurn 1.8s linear infinite!important}
body.magic .scene .ball-magic-overlay{animation:orbPulse .7s ease-in-out 5}
@media(prefers-reduced-motion:reduce){
 .scene .cloud-one,.scene .cloud-two,.scene .cloud-three,.scene .magic-sparkles,
 body.magic .scene .cloud-one,body.magic .scene .cloud-two,body.magic .scene .cloud-three,
 body.magic .scene .magic-sparkles{animation:none!important}
}

.scene .hear-fortune{position:absolute;top:125%;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:15;background:#32154deb;border:2px solid #d8a8fa;border-radius:24px;padding:9px 17px;color:#fff1ff;font:600 13px system-ui,sans-serif;cursor:pointer;box-shadow:0 0 17px #ad4bd080}
.scene .hear-fortune[hidden]{display:none!important}
.scene .hear-fortune:focus-visible{outline:3px solid white;outline-offset:3px}
</style></head><body><main class="stage"><div class="scene">
<div class="window" aria-hidden="true"></div><div class="candle left" aria-hidden="true"></div><div class="candle right" aria-hidden="true"></div>
<h1>The Enchanted Fortune Teller</h1>
<div class="ball-wrap" aria-hidden="true"><div class="ball"><div class="mist"></div><div class="mist second"></div><span class="star s1">✦</span><span class="star s2">✧</span><span class="star s3">✦</span></div></div>
<div class="stand" aria-hidden="true"></div>
<div class="ball-magic-overlay" aria-hidden="true"><div class="magic-cloud cloud-one"></div><div class="magic-cloud cloud-two"></div><div class="magic-cloud cloud-three"></div><div class="magic-sparkles"></div></div>
<div class="fortune-writing" id="fortune-writing" aria-live="polite" aria-atomic="true">
 <div class="fortune-name" id="fortune-name"></div>
 <div class="fortune-time" id="fortune-time"></div>
</div>
<div class="controls"><button id="mic" class="mic" type="button" aria-label="Start listening for the secret magic spell" title="Listen for magic">
<svg viewBox="0 0 48 48"><rect x="17" y="6" width="14" height="25" rx="7"></rect><path d="M11 22v3a13 13 0 0 0 26 0v-3M24 38v6M16 44h16"></path></svg></button>
<div id="status" class="status" role="status" aria-live="polite"></div><button id="hearFortune" class="hear-fortune" type="button" hidden aria-label="Hear the fortune teller's announcement again">Hear her voice</button></div>
</div></main><script>
(function(){
'use strict';
const btn=document.getElementById('mic'),status=document.getElementById('status');
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null,desired=false,started=false,magicRunning=false,retry=null,audio=null,starting=false,session=0,heardParts=[];
const fortunes=[
 ['Boo baskets','4:35 – 5:30'],
 ['Boba','5:30 – 5:45'],
 ['Getting ready','6:00 – 6:30'],
 ['Pizza','6:30 – 7:00'],
 ['Pumpkin carving','7:00 – 7:30'],
 ['Trick or treating','7:30 – 8:45'],
 ['Karaoke','9:00 – 10:00'],
 ['Moveeeeee','10:00 – 11:00'],
 ['Sleepover Timeee','']
];
const writing=document.getElementById('fortune-writing');
const fortuneName=document.getElementById('fortune-name');
const fortuneTime=document.getElementById('fortune-time');
const progressKey='emily-fortune-next-v3';
let nextFortune=0;
try{const saved=Number(sessionStorage.getItem(progressKey));if(Number.isInteger(saved)&&saved>=0&&saved<=fortunes.length)nextFortune=saved}catch(e){}
// Voice practice: try automatic speech, plus a user-tapped replay for iPad Safari.
const practiceLine='Ahhh... the crystal ball has spoken. On this mysterious Halloween night... your first destiny awaits. It is time... to discover your Boo Baskets.';
const hearButton=document.getElementById('hearFortune');
let currentUtterance=null,voiceWasPrimed=false,voiceAttempt=0;
function findVoice(){
 if(!('speechSynthesis' in window))return null;
 const voices=window.speechSynthesis.getVoices();
 const english=voices.filter(v=>/^en(?:-|_)/i.test(v.lang));
 const preferred=['serena','martha','kate','moira','samantha','tessa','victoria','karen','susan','female'];
 return english.find(v=>preferred.some(n=>v.name.toLowerCase().includes(n)))||
        english.find(v=>/^en-GB/i.test(v.lang))||english[0]||voices[0]||null;
}
function primeVoice(){
 // Safari may require speech output to be unlocked by a direct user tap.
 if(voiceWasPrimed||!('speechSynthesis' in window))return;
 voiceWasPrimed=true;
 try{
  const warmup=new SpeechSynthesisUtterance(' ');
  warmup.volume=0;warmup.rate=1;warmup.lang='en-GB';
  window.speechSynthesis.speak(warmup);
  window.speechSynthesis.resume();
 }catch(e){}
}
function speakFirstFortune(){
 if(!('speechSynthesis' in window)){
  hearButton.textContent='Voice unavailable on this browser';
  hearButton.hidden=false;
  return;
 }
 try{
  const synth=window.speechSynthesis;
  synth.cancel();
  const voiceLine=new SpeechSynthesisUtterance(practiceLine);
  const voice=findVoice();
  if(voice)voiceLine.voice=voice;
  voiceLine.lang=voice?.lang||'en-GB';
  voiceLine.rate=.79;voiceLine.pitch=.84;voiceLine.volume=1;
  currentUtterance=voiceLine;
  voiceLine.onstart=()=>{hearButton.textContent='Hear her voice again';};
  voiceLine.onerror=()=>{hearButton.textContent='Tap to hear her voice';};
  synth.speak(voiceLine);
  synth.resume();
  hearButton.hidden=false;
 }catch(e){hearButton.hidden=false;hearButton.textContent='Tap to hear her voice';}
}
hearButton.addEventListener('click',()=>{
 primeVoice();
 if('speechSynthesis' in window){window.speechSynthesis.cancel();window.speechSynthesis.resume();}
 speakFirstFortune();
});
if('speechSynthesis' in window&&window.speechSynthesis.onvoiceschanged!==undefined){
 window.speechSynthesis.addEventListener('voiceschanged',()=>{findVoice()});
}
function reveal(){
 const index=nextFortune;
 const entry=fortunes[index];
 if(!entry)return;
 fortuneName.textContent=entry[0];fortuneTime.textContent=entry[1];
 writing.classList.add('revealed');
 nextFortune++;
 try{sessionStorage.setItem(progressKey,String(nextFortune))}catch(e){}
 if(index===0)speakFirstFortune();
}
function info(t){status.textContent=t||''}
function norm(t){return t.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const n=[i];for(let j=1;j<=b.length;j++)n[j]=Math.min(n[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=n}return p[b.length]}
function near(w,choices){return choices.some(c=>w===c||(w.length>=3&&Math.abs(w.length-c.length)<=1&&lev(w,c)<=1))}
function spell(raw){
 const w=norm(raw).split(' ').filter(Boolean);
 const zig=['ziggy','ziggie','zigi','ziggi','siggy','sigi'];
 const zag=['zaggy','zacky','zaggi','zaki','zagy','zag','zackie'];
 const zee=['zee','see','z','zi','sea'];
 const fate=['fate','faith','feet','future','fayt','face'];
 for(let i=0;i<w.length;i++){
  if(!near(w[i],zig))continue;
  // Require both Ziggies, Zaggy, Zee in order. Allow a tiny transcription
  // glitch between words, but never accept an unrelated phrase.
  let pos=i+1,phase=0,finish=-1;
  const parts=[zig,zag,zee];
  for(const part of parts){
   let found=-1;
   for(let j=pos;j<Math.min(pos+3,w.length);j++){
    if(near(w[j],part)){found=j;break}
   }
   if(found<0){phase=-1;break}
   phase++;pos=found+1;finish=found;
  }
  if(phase!==3)continue;
  const rest=w.slice(finish+1,finish+12);
  const hasQuestion=rest.some(x=>['what','wot','whats','will'].includes(x));
  const hasFate=rest.some(x=>near(x,fate));
  const hasEnd=rest.some(x=>['be','bee','we','will'].includes(x));
  if(hasQuestion&&hasFate&&hasEnd)return true;
 }
 return false;
}
function readySound(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!audio)audio=new A();if(audio.state==='suspended')audio.resume()}catch(e){}}
function whoosh(){
 // A single dramatic sweeping wind effect; no beeps, bells or double chimes.
 try{
  if(!audio)return;
  const c=audio,now=c.currentTime,duration=3.25;
  const len=Math.floor(c.sampleRate*duration),buffer=c.createBuffer(1,len,c.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*.56;
  const source=c.createBufferSource();source.buffer=buffer;
  const high=c.createBiquadFilter();high.type='highpass';high.frequency.value=100;
  const low=c.createBiquadFilter();low.type='lowpass';low.Q.value=.75;
  low.frequency.setValueAtTime(230,now);
  low.frequency.exponentialRampToValueAtTime(3200,now+1.3);
  low.frequency.exponentialRampToValueAtTime(180,now+duration);
  const gain=c.createGain();
  gain.gain.setValueAtTime(.0001,now);
  gain.gain.linearRampToValueAtTime(.78,now+.95);
  gain.gain.setValueAtTime(.78,now+1.55);
  gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  source.connect(high);high.connect(low);low.connect(gain);gain.connect(c.destination);
  source.start(now);source.stop(now+duration);
 }catch(e){}
}
function stop(){
 desired=false;started=false;starting=false;session++;
 heardParts=[];clearTimeout(retry);
 btn.classList.remove('listening');btn.setAttribute('aria-label','Start listening');
 try{recognition&&recognition.abort()}catch(e){}
}
function magic(){
 if(magicRunning)return;
 magicRunning=true;stop();info('');
 writing.classList.remove('revealed');
 document.body.classList.add('magic');whoosh();
 setTimeout(()=>{document.body.classList.remove('magic');reveal();magicRunning=false},3500);
}
function scheduleRestart(id,delay){
 if(!desired||magicRunning||id!==session)return;
 clearTimeout(retry);
 retry=setTimeout(()=>{if(desired&&!magicRunning&&id===session)listen()},delay);
}
function listen(){
 if(!desired||started||starting||magicRunning)return;
 const id=session;
 starting=true;
 try{
  const r=new Recognition();recognition=r;
  r.lang='en-GB';r.continuous=true;r.interimResults=true;r.maxAlternatives=5;
  r.onstart=()=>{
   if(id!==session||!desired){try{r.abort()}catch(e){}return}
   starting=false;started=true;btn.classList.add('listening');info('');
  };
  r.onresult=e=>{
   if(id!==session||!desired)return;
   const transcript=[];
   for(let i=0;i<e.results.length;i++){
    const row=e.results[i];
    if(!row||!row.length)continue;
    transcript.push(row[0].transcript);
    for(let j=0;j<Math.min(row.length,5);j++){
     if(spell(row[j].transcript)){magic();return}
    }
   }
   // iPad Safari sometimes divides a single sentence across result rows.
   const combined=transcript.join(' ');
   if(spell(combined)){magic();return}
   const latest=norm(combined);
   if(latest&&!heardParts.includes(latest)){
    heardParts.push(latest);
    if(heardParts.length>5)heardParts.shift();
    if(spell(heardParts.join(' '))){magic();return}
   }
  };
  r.onerror=e=>{
   if(id!==session)return;
   if(e.error==='not-allowed'||e.error==='service-not-allowed'){stop();info('Allow microphone access in Safari settings.')}
   else if(e.error==='audio-capture'){stop();info('Microphone unavailable. Check iPad permissions.')}
   else if(e.error==='network'){stop();info('Speech recognition needs an internet connection.')}
   // 'no-speech' is silent and recoverable.
  };
  r.onend=()=>{
   if(id!==session)return;
   started=false;starting=false;
   scheduleRestart(id,240);
  };
  r.start();
 }catch(e){starting=false;scheduleRestart(id,550)}
}
if(!Recognition){btn.disabled=true;info('Speech recognition unavailable. Try Safari on your iPad.');return}
btn.addEventListener('click',()=>{readySound();primeVoice();if(desired){stop();info('');return}if(magicRunning)return;desired=true;session++;heardParts=[];btn.classList.add('listening');btn.setAttribute('aria-label','Stop listening');info('');listen()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&desired)stop()});
})();
</script></body></html>
